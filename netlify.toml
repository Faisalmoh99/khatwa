# Netlify: builds the new app in web/ and publishes web/dist.
# Legacy pages keep their URLs (copied by web/scripts/copy-legacy.mjs):
#   /sim/  /dev/live.html  /story/  /js/*  and the old prototype at /legacy/
# Rollback: Netlify → Deploys → pick the last deploy before the switch → "Publish deploy".
[build]
  command = "cd web && npm ci && npm run build"
  publish = "web/dist"

# AI function (phase 5). ANTHROPIC_API_KEY is a Netlify secret, never in the repo.
[functions]
  directory = "web/netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"

# The service worker and manifest must always be fresh so updates reach phones.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# The AI function, before the single-page fallback below.
[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200
  force = true

# Single-page app: unknown paths go to the app. Existing files (sim, story, legacy…) are served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
